[project]
name = "awl-playground"
description = "Interactive AWL-LD playground: edit a procedure as blocks, as source, and run it"
version = "0.1.0"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    # From a sibling awl-python checkout rather than PyPI: the editor variants
    # track an unreleased branch. scripts/build_wasm.py builds the wheel.
    "awl",
    "panel>=1.5",
    "param>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "playwright>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/awl_playground"]

[tool.uv.sources]
awl = { path = "../../awl-python", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "schema-playground"
description = "Interactive OO-LD playground: two schemas, one instance, read through each"
version = "0.1.0"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    # The released validator: validate_schema/validate_instance and the schema-derived frames.
    "oold[validation]>=0.20",
    "panel>=1.5",
    "panelini>=0.11",
    "param>=2",
    "pydantic>=2",
    # Imported directly here (the RDF pipeline and the YAML panes), not merely through oold.
    "pyld",
    "rdflib",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "playwright>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schema_playground"]

[tool.pytest.ini_options]
testpaths = ["tests"]
